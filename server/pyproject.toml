[project]
name = "pharmafetch-ai"
version = "0.1.0"
description = "PharmaFetch AI - Voice agent that finds medication at pharmacies"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[deepgram,gradium,openai,runner,silero,webrtc,websocket]>=1.3.0",
    "pipecatcloud>=0.7.1",
    "twilio",
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "aiohttp",
    "loguru",
    "jinja2",
    "websockets",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
    "pytest",
    "httpx",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I", "UP"]
